services:
  db:
    image: postgres:16
    container_name: saas_db
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app_password
      POSTGRES_DB: saas
    ports:
      - "5433:5432" # 5432 on this laptop is already used by a local Postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d saas"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
